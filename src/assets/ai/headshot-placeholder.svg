<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1000" viewBox="0 0 800 1000">
  <style>
    .bg { fill: #faf9f6; }
    .inset { fill: none; stroke: #7a7870; stroke-width: 2; stroke-dasharray: 10 8; }
    .label { fill: #45443f; font: 500 30px "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace; letter-spacing: 0.04em; }
    .meta { fill: #64635c; font: 500 22px "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #232321; }
      .inset { stroke: #787670; }
      .label { fill: #b8b6ad; }
      .meta { fill: #8f8d85; }
    }
  </style>
  <rect class="bg" width="800" height="1000"/>
  <rect class="inset" x="40" y="40" width="720" height="920"/>
  <text class="label" x="400" y="492" text-anchor="middle">TODO: headshot</text>
  <text class="meta" x="400" y="536" text-anchor="middle">4:5 · plain background</text>
</svg>
